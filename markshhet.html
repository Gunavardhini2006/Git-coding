<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mark Sheet</title>
  <style>
    body {
      background: linear-gradient(to top, #98d7f4, #eaf7fb);
      overflow-x: hidden;
      height: 100vh;
      position: relative;
    }

    .border {
      border: 4px solid #13029b;
      border-radius: 2px;
      background-color: #faf9fc;
      padding: 15px;
      margin: 30px auto;
      width: fit-content;
    }

    table {
      border-collapse: separate;
      border-spacing: 6px;
      margin: auto;
    }

    td {
      padding: 13px 40px;
      background-color: #82eaeaf9;
      font-size: 20px;
      font-family: Georgia, Times, 'Times New Roman', serif;
      color: #27011d;
    }

    .heading {
      color: #0b0251;
      font-size: 35px;
      font-family:Georgia, 'Times New Roman', Times, serif;
      text-align:left;
      margin-bottom: 15px;
    }

    input[type="number"] {
      width: 100px;
    }

    input[type="text"] {
      width: 100px;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
    }

    .btn {
      background-color: #1e05fbf9;
      color: #faf9fc;
      padding: 13px 35px;
      border-radius: 2px;
      font-size: 20px;
      font-family: 'Times New Roman', Times, serif;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #090147;
    }
  </style>
 <script>
    function marksToGradePoint(marks) {
      if (marks >= 91) return 10;
      else if (marks >= 81) return 9;
      else if (marks >= 71) return 8;
      else if (marks >= 61) return 7;
      else if (marks >= 51) return 6;
      else if (marks >= 41) return 5;
      else if (marks >= 33) return 4;
      else return 0;
    }
  
    function calculate() {
      let form = document.form;
  
      let marks = [
        parseInt(form.sub0.value) || 0,
        parseInt(form.sub1.value) || 0,
        parseInt(form.sub2.value) || 0,
        parseInt(form.sub3.value) || 0,
        parseInt(form.sub4.value) || 0,
        parseInt(form.sub5.value) || 0,
      ];
  
      let total = marks.reduce((a, b) => a + b, 0);
      let percentage = (total * 100 / 600).toFixed(2);
  
      form.total.value = total;
      form.per.value = percentage;
  
      // Grade logic
      let grade = "Fail";
      if (percentage >= 90) grade = "A+";
      else if (percentage >= 80) grade = "A";
      else if (percentage >= 70) grade = "B";
      else if (percentage >= 60) grade = "C";
      else if (percentage >= 50) grade = "D";
  
      form.grade.value = grade;
  
      // CGPA logic
      let gradePoints = marks.map(marksToGradePoint);
      let cgpa = (gradePoints.reduce((a, b) => a + b, 0) / gradePoints.length).toFixed(2);
      form.cgpa.value = cgpa;
    }
  
    function resetForm() {
      document.form.reset();
    }
  
    function printPage() {
      window.print();
    }
  </script>
  
</head>
<body>
  <fieldset class="border">
    <legend class="heading"><b>Mark Sheet</b></legend>
    <form name="form">
      <table>
        <tr>
          <td>Data Structures</td>
          <td><input type="number" name="sub0" min="0" max="100"> (Max: 100)</td>
        </tr>
        <tr>
          <td>Mathematics</td>
          <td><input type="number" name="sub1" min="0" max="100"> (Max: 100)</td>
        </tr>
        <tr>
          <td>Environmental Science</td>
          <td><input type="number" name="sub2" min="0" max="100"> (Max: 100)</td>
        </tr>
        <tr>
          <td>Engineering Chemistry</td>
          <td><input type="number" name="sub3" min="0" max="100"> (Max: 100)</td>
        </tr>
        <tr>
          <td>Engineering Phyiscs</td>
          <td><input type="number" name="sub4" min="0" max="100"> (Max: 100)</td>
        </tr>
        <tr>
          <td>English</td>
          <td><input type="number" name="sub5" min="0" max="100"> (Max: 100)</td>
        </tr>
        <tr>
          <td>Total</td>
          <td><input type="number" name="total" readonly> (Max: 600)</td>
        </tr>
        <tr>
          <td>Percentage</td>
          <td><input type="number" name="per" readonly> (Max: 100%)</td>
        </tr>
        <tr>
          <td>Grade</td>
          <td><input type="text" name="grade" readonly></td>
        </tr>
        <tr>
            <td>CGPA</td>
            <td><input type="number" name="cgpa" readonly/> (Max: 10)</td>
          </tr>
          
      </table>

      <!-- Buttons -->
      <div class="button-group">
        <button type="button" class="btn" onclick="calculate()">Calculate</button>
        <button type="button" class="btn" onclick="resetForm()">Reset</button>
        <button type="button" class="btn" onclick="printPage()">Print</button>
      </div>
    </form>
  </fieldset>
</body>
</html>
